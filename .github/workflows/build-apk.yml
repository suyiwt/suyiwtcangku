name: Build ITSC Timer APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: 更换apt清华源，更新系统
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y

      - name: 安装系统依赖 + JDK11
        run: |
          sudo apt install -y git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config libpng-dev libjpeg-dev libtiff-dev libwebp-dev libssl-dev libffi-dev python3-dev build-essential
        env:
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64

      - name: 安装buildozer
        run: |
          pip3 install --upgrade buildozer -i https://pypi.tuna.tsinghua.edu.cn/simple
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      # ====================== 【修复后】清华镜像下载Android SDK ======================
      - name: Download & setup Android SDK
        run: |
          export SDK_ROOT=${GITHUB_WORKSPACE}/android-sdk
          mkdir -p ${SDK_ROOT}/cmdline-tools
          cd ${SDK_ROOT}/cmdline-tools
          # 清华镜像下载cmdline-tools
          wget --timeout=30 -q https://mirrors.tuna.tsinghua.edu.cn/android/repository/cmdline-tools-linux-11.0.zip
          unzip -q cmdline-tools-linux-11.0.zip
          mv cmdline-tools latest
          cd latest/bin
          chmod +x sdkmanager
          # 一次性接受全部SDK许可证
          yes | ./sdkmanager --licenses
          # 安装platform33 + build-tools34
          ./sdkmanager "platforms;android-33" "build-tools;34.0.0"
          # 导出环境变量
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV

      - name: Generate buildozer spec (if missing)
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
        env:
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Build debug APK
        run: |
          buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: ITSC-Timer-APK
          path: bin/*.apk

      - name: 失败时打印日志
        if: failure()
        run: |
          cat .buildozer/logs/buildozer.log || echo "Log not found"
