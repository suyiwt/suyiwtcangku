[app]

# 包名，必须小写，无空格
package.name = itsctimer
package.domain = org.itsctimer
app_name = ITSC Timer

source.dir = .
source.include_exts = py,png,jpg,svg,ttf
source.exclude_dirs = tests, bin, .github, .git

# 依赖：kivy 2.3.0 + plyer（安卓通知震动）
requirements = python3,kivy==2.3.0,plyer

# Android SDK配置（和workflow对齐）
android.api = 33
android.build_tools = 34.0.0
android.ndk = 25b
android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk
android.accept_sdk_license = True

# 安卓权限（plyer通知、震动必须）
android.permissions = VIBRATE,POST_NOTIFICATIONS,INTERNET
android.private_api = False

# 方向：竖屏
android.orientation = portrait
android.allow_backup = True

# 不要自动下载SDK，我们workflow手动预置
android.skip_update = True

# 日志关闭（和你代码KIVY_NO_CONSOLELOG匹配）
log_level = 0

# 打包配置
android.debug_manifest = True
android.add_aar = 
android.add_jar = 

[buildozer]
log_level = 2
warn_on_root = 1
