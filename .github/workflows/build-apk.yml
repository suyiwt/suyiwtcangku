name: Build ITSC Timer APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: 更换apt清华源，更新系统
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y

      - name: 安装系统依赖 + JDK17
        run: |
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config libpng-dev libjpeg-dev libtiff-dev libwebp-dev libssl-dev libffi-dev python3-dev build-essential
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: 安装buildozer
        run: |
          pip3 install --upgrade buildozer -i https://pypi.tuna.tsinghua.edu.cn/simple
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      # ========== 关键：预先接受所有Android SDK许可证（在buildozer目录内） ==========
      - name: 预下载SDK并接受全部许可
        run: |
          # 先让buildozer生成目录
          buildozer android sdkinstall || true
          # 进入buildozer自己的sdk目录，执行许可证同意
          SDK_PATH=${HOME}/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          if [ -d "$SDK_PATH" ]; then
            cd $SDK_PATH
            yes | ./sdkmanager --licenses
          fi
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Generate buildozer spec (if missing)
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          # 开启自动接受许可，锁定api和build-tools版本
          sed -i 's/^android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/^android.api =.*/android.api = 33/g' buildozer.spec
          sed -i 's/^android.build_tools =.*/android.build_tools = 37.0.0/g' buildozer.spec
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Build debug APK
        run: |
          buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: ITSC-Timer-APK
          path: bin/*.apk

      - name: 失败时打印日志
        if: failure()
        run: |
          cat .buildozer/logs/buildozer.log || echo "Log not found"
