name: Build ITSC Timer APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: 更换apt清华源，更新系统
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y

      - name: 安装系统依赖 + JDK17
        run: |
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config libpng-dev libjpeg-dev libtiff-dev libwebp-dev libssl-dev libffi-dev python3-dev build-essential
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: 安装buildozer
        run: |
          pip3 install --upgrade buildozer -i https://pypi.tuna.tsinghua.edu.cn/simple
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-itsc-timer-${{ hashFiles('**/buildozer.spec') }}

      # ====================== 修复Android SDK安装步骤 ======================
      - name: Download & setup Android SDK
        run: |
          export SDK_ROOT=${GITHUB_WORKSPACE}/android-sdk
          mkdir -p ${SDK_ROOT}/cmdline-tools/latest
          cd ${SDK_ROOT}/cmdline-tools/latest
          # 清华镜像下载cmdline-tools 11.0，增加重试
          wget --timeout=30 --tries=3 -q https://mirrors.tuna.tsinghua.edu.cn/android/repository/cmdline-tools-linux-11.0.zip
          unzip -q cmdline-tools-linux-11.0.zip
          # 压缩包内文件在cmdline-tools文件夹，移动到当前latest目录
          mv cmdline-tools/* .
          rm -rf cmdline-tools
          chmod +x bin/sdkmanager
          export PATH=$PWD/bin:$PATH
          # 自动接受许可，安装SDK组件
          sdkmanager --sdk_root=${SDK_ROOT} --yes --licenses
          sdkmanager --sdk_root=${SDK_ROOT} --yes "platforms;android-33" "build-tools;34.0.0" platform-tools
          # 导出环境变量
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Generate buildozer spec (if missing)
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Build debug APK
        run: |
          buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: ITSC-Timer-APK
          path: bin/*.apk

      - name: 失败时打印日志
        if: failure()
        run: |
          cat .buildozer/logs/buildozer.log || echo "Log not found"
