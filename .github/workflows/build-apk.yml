name: Build ITSC Timer APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: 更换apt清华源
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y

      - name: 安装系统依赖 + JDK17
        run: |
          sudo apt install -y git zip unzip wget openjdk-17-jdk python3-pip autoconf libtool pkg-config libpng-dev libjpeg-dev libtiff-dev libwebp-dev libssl-dev libffi-dev python3-dev build-essential
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: 安装buildozer
        run: |
          pip3 install --upgrade buildozer -i https://pypi.tuna.tsinghua.edu.cn/simple
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

      # ========= 手动下载cmdline-tools，安装SDK组件 =========
      - name: 手动下载Android cmdline-tools并预安装SDK
        run: |
          SDK_ROOT=${HOME}/.buildozer/android/platform/android-sdk
          mkdir -p ${SDK_ROOT}/cmdline-tools/latest
          # 下载linux版cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d cmdline
          # 移动到buildozer的sdk目录
          mv cmdline/cmdline-tools/* ${SDK_ROOT}/cmdline-tools/latest/
          SDK_BIN=${SDK_ROOT}/cmdline-tools/latest/bin
          export ANDROID_HOME=${SDK_ROOT}
          # 接受全部许可，安装平台和build-tools
          yes | ${SDK_BIN}/sdkmanager --licenses
          ${SDK_BIN}/sdkmanager --install "platforms;android-33" "build-tools;34.0.0" --yes
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      # 【调整】缓存放在SDK安装之后
      - name: Cache buildozer ~/.buildozer
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-cache-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-cache-

      - name: Generate buildozer spec
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          sed -i 's/^android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/^android.api =.*/android.api = 33/g' buildozer.spec
          sed -i 's/^android.build_tools =.*/android.build_tools = 34.0.0/g' buildozer.spec
          # 删除旧sdk_path行，重新写入
          sed -i '/android.sdk_path =/d' buildozer.spec
          echo "android.sdk_path = ${HOME}/.buildozer/android/platform/android-sdk" >> buildozer.spec
          cat buildozer.spec # 打印出来校验
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Build debug APK
        run: |
          export ANDROID_HOME=${HOME}/.buildozer/android/platform/android-sdk
          buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: ${{HOME}}/.buildozer/android/platform/android-sdk
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
          P4A_RELEASES_MIRROR_URL: https://mirrors.tuna.tsinghua.edu.cn/github-release/kivy/python-for-android/

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: ITSC-Timer-APK
          path: bin/*.apk

      - name: 失败打印日志
        if: failure()
        run: |
          cat ~/.buildozer/logs/buildozer.log || echo "Log not found"
