name: Build ITSC Timer APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: 更换apt清华源
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y

      - name: 安装系统依赖 + JDK17
        run: |
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config libpng-dev libjpeg-dev libtiff-dev libwebp-dev libssl-dev libffi-dev python3-dev build-essential
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: 安装buildozer
        run: |
          pip3 install --upgrade buildozer -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Cache buildozer .buildozer
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-cache-${{ hashFiles('buildozer.spec') }}

      # ========== 核心步骤：手动初始化buildozer的SDK，预先安装所有需要包，提前接受license ==========
      - name: 初始化buildozer SDK目录，手动安装SDK组件
        run: |
          # 触发buildozer下载cmdline-tools，生成SDK目录
          buildozer android sdkinstall || true
          SDK_ROOT=${HOME}/.buildozer/android/platform/android-sdk
          SDK_BIN=${SDK_ROOT}/cmdline-tools/latest/bin
          # 接受全部许可
          yes | ${SDK_BIN}/sdkmanager --licenses
          # 强制安装需要的包，一次性装好platforms和build-tools
          ${SDK_BIN}/sdkmanager --install "platforms;android-33" "build-tools;37.0.0" --yes
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Generate buildozer spec
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          sed -i 's/^android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/^android.api =.*/android.api = 33/g' buildozer.spec
          sed -i 's/^android.build_tools =.*/android.build_tools = 37.0.0/g' buildozer.spec
          # 禁止p4a自动下载SDK，告诉p4a使用已经装好的SDK
          sed -i '/android.sdk_path =/d' buildozer.spec
          echo "android.sdk_path = ${HOME}/.buildozer/android/platform/android-sdk" >> buildozer.spec
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Build debug APK
        run: |
          buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
          P4A_RELEASES_MIRROR_URL: https://mirrors.tuna.tsinghua.edu.cn/github-release/kivy/python-for-android/
          P4A_BOOTSTRAP_MIRROR_URL: https://mirrors.tuna.tsinghua.edu.cn/github-release/kivy/python-for-android/

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: ITSC-Timer-APK
          path: bin/*.apk

      - name: 失败打印日志
        if: failure()
        run: |
          cat ~/.buildozer/logs/buildozer.log || echo "Log not found"
